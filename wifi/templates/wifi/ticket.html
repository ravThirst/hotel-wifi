<!-- wifi/templates/wifi/ticket.html -->
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WiFi Ticket</title>
    <style>
        @page {
            size: a5 portrait;
            margin: 2cm;
        }
        body {
            font-family: Helvetica, sans-serif;
            color: #333333;
            font-size: 12pt;
        }
        .center { text-align: center; }
        .title { font-size: 20pt; font-weight: bold; color: #0056b3; }
        .room { font-size: 28pt; font-weight: bold; }
        .label { font-size: 13pt; color: #666666; text-transform: uppercase; }
        .value { font-size: 24pt; font-weight: bold; letter-spacing: 2px; }
        .footer { font-size: 9pt; color: #888888; }
    </style>
</head>
<body>
    <!-- Header -->
    <table width="100%" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td class="center" style="border-bottom: 2px solid #0056b3; padding-bottom: 10px;">
                <!-- Base64 Image Embedding (Bulletproof for xhtml2pdf) -->
                {% if logo_base64 %}
                    <img src="data:image/png;base64,{{ logo_base64 }}" style="height: 50px; width: auto;" /><br/>
                {% endif %}
                <span class="title">Guest WiFi Access</span>
            </td>
        </tr>
    </table>

    <br/>

    <!-- Room Number -->
    <table width="100%" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td class="center room">
                Room {{ room.room_number }}
            </td>
        </tr>
    </table>


    <!-- Credentials Box (Inline styles used for maximum compatibility) -->
    <table width="100%" border="0" cellpadding="15" cellspacing="0" style="border: 2px dashed #999999; background-color: #f4f4f4;">
        <tr>
            <td class="center">
                <span class="label">Network Name (SSID)</span><br/>
                <br/>
                <span class="value">{{ ssid }}</span>
            </td>
        </tr>
        <tr>
            <td class="center" style="padding-top: 10px;">
                <span class="label">User</span><br/>
                <br/>
                <span class="value">room{{ room.room_number }}</span>
            </td>
        </tr>
        <tr>
            <td class="center" style="padding-top: 10px;">
                <span class="label">Password</span><br/>
                <br/>
                <span class="value">{{ session.password }}</span>
            </td>
        </tr>
    </table>

    <br/>

    <!-- Footer -->
    <table width="100%" border="0" cellpadding="0" cellspacing="0" class="footer">
        <tr>
            <td class="center">
                Thank you for staying with us!<br/>
                Please contact the front desk if you need assistance.
            </td>
        </tr>
    </table>
</body>
</html>
